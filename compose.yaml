services:
  web:
    build: .
    container_name: miniticket_web
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  db:
    image: mysql:8.4.11
    container_name: miniticket_db
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:8.0.29
    container_name: miniticket_mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:
  mongo_data:
  vendor_data: